name: Daily Paper Radar

on:
  schedule:
    # 主触发：北京时间 10:02（02:02 UTC）；故意避开 :00，减少 GitHub cron 高峰排队
    - cron: "2 2 * * *"
    # 备用触发：GitHub cron 偶发漏跑/延迟，一天多点几次名。
    # seen 里的当日标记 day:YYYY-MM-DD 会让重复触发空跑，不会重复推送。
    - cron: "47 2 * * *"   # 10:47 北京
    - cron: "20 4 * * *"   # 12:20 北京
    - cron: "35 6 * * *"   # 14:35 北京
  workflow_dispatch:
    inputs:
      smoke_llm:
        description: "只测 LLM 导读（不抓取/不推送）"
        type: boolean
        default: false
      dry_run:
        description: "测试模式：出飞书卡片，但不写 seen、不进 Zotero"
        type: boolean
        default: false
      only_comm:
        description: "只跑传播学日更"
        type: boolean
        default: false
      reset_library:
        description: "调试清库：清空 seen + 删 Zotero 调试条目 + 建日更集合（不推送）"
        type: boolean
        default: false

# 同时触发（GitHub cron + 外部 cron 同刻叫醒）时排队而非并行，
# 防止两个 run 都还没写当日标记就各自推一遍
concurrency:
  group: daily-paper-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset debug library
        if: ${{ inputs.reset_library == true }}
        run: python -m paper_radar.reset
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}

      - name: Run paper radar
        if: ${{ inputs.reset_library != true && !(inputs.only_comm == true) }}
        run: python -m paper_radar.main
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID_AI: ${{ secrets.NOTION_PAGE_ID_AI }}
          NOTION_PAGE_ID_COMM: ${{ secrets.NOTION_PAGE_ID_COMM }}
          SMOKE_LLM: ${{ inputs.smoke_llm && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Run comm daily
        if: ${{ inputs.reset_library != true }}
        run: python -m paper_radar.comm
        env:
          FEISHU_COMM_WEBHOOK_URL: ${{ secrets.FEISHU_COMM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID_AI: ${{ secrets.NOTION_PAGE_ID_AI }}
          NOTION_PAGE_ID_COMM: ${{ secrets.NOTION_PAGE_ID_COMM }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Commit seen state
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data/seen.json 2>/dev/null || true
          git add data/seen_comm.json 2>/dev/null || true
          git add notes 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: update seen papers [skip ci]"
            git push
          fi
