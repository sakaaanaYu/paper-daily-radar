name: Daily Paper Radar

on:
  schedule:
    # 07:35 北京时间 = 23:35 UTC 前一天（避开整点高峰）
    - cron: "35 23 * * *"
  workflow_dispatch:
    inputs:
      smoke_llm:
        description: "只测 LLM 导读（不抓取/不推送）"
        type: boolean
        default: false
      dry_run:
        description: "测试模式：出飞书卡片，但不写 seen、不进 Zotero"
        type: boolean
        default: false
      only_comm:
        description: "只跑传播学日更"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper radar
        if: ${{ !(inputs.only_comm == true) }}
        run: python -m paper_radar.main
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SMOKE_LLM: ${{ inputs.smoke_llm && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Run comm daily
        run: python -m paper_radar.comm
        env:
          FEISHU_COMM_WEBHOOK_URL: ${{ secrets.FEISHU_COMM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Commit seen state
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data/seen.json data/seen_comm.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: update seen papers [skip ci]"
            git push
          fi
