# Paper Radar 配置 —— 按你的研究兴趣改 keywords 和 venues

arxiv:
  # 关注的 arXiv 分类
  categories:
    - cs.HC    # 人机交互
    - cs.AI    # 人工智能
    - cs.CL    # 计算语言学
    - cs.CY    # 计算与社会
  max_results: 80

openreview:
  # 顶会 venueid。从 openreview.net 会议页 URL 或论文的 venueid 字段抄。
  # 注意：CHI 不在 OpenReview（用 PCS 系统）；ACL 走 ACL Rolling Review。
  venues:
    - "ICLR.cc/2026/Conference"      # 可用
    - "NeurIPS.cc/2026/Conference"   # 放榜后自动有数据
    - "NeurIPS.cc/2025/Conference"   # 近期已录用
  max_per_venue: 40

# 关键词：命中标题权重高，命中摘要权重低。留空则不过滤。
keywords:
  - "generative AI"
  - "GenAI"
  - "large language model"
  - "LLM"
  - "AI literacy"
  - "digital literacy"
  - "human-AI interaction"
  - "prompt engineering"
  - "AI-assisted"
  - "learning"
  - "education"
  - "trust in AI"
  - "multimodal"
  - "audiovisual"
  - "media psychology"

# 每天最多推送/入库的篇数
max_papers_per_day: 10

# 分类体系：卡片按此分组，关键词预分类 + LLM 修正
# id 会出现在 LLM 输出里，不要随意改；label 是卡片/Zotero 上显示的名字
categories:
  - id: hci
    label: "🧑‍💻 人机交互与AI素养"
    keywords:
      - "human-AI"
      - "human-AI interaction"
      - "human computer interaction"
      - "HCI"
      - "AI literacy"
      - "digital literacy"
      - "AI-assisted"
      - "user study"
      - "interaction design"
      - "trust in AI"
      - "explainable"
      - "transparency"
      - "algorithmic"
  - id: learning
    label: "📚 学习与教育"
    keywords:
      - "learning"
      - "education"
      - "educational"
      - "teaching"
      - "student"
      - "classroom"
      - "curriculum"
      - "instruction"
      - "tutor"
      - "assessment"
      - "learning science"
      - "knowledge construction"
  - id: media
