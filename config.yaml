# Paper Radar 配置 —— 按你的研究兴趣改 keywords 和 venues

arxiv:
  # 关注的 arXiv 分类（AI 顶会主粮 + 可信/HCI）
  categories:
    - cs.AI    # 人工智能
    - cs.LG    # 机器学习
    - cs.CL    # 计算语言学（LLM/智能体）
    - cs.HC    # 人机交互
    - cs.CR    # 密码学与安全（可信AI/隐私侧）
  max_results: 80

openreview:
  # 顶会 venueid。从 openreview.net 会议页 URL 或论文的 venueid 字段抄。
  # 注意：CHI 不在 OpenReview（用 PCS 系统）；ACL 走 ACL Rolling Review。
  venues:
    - "ICLR.cc/2026/Conference"      # 可用
    - "NeurIPS.cc/2026/Conference"   # 放榜后自动有数据
    - "NeurIPS.cc/2025/Conference"   # 近期已录用
  max_per_venue: 40

# 关键词：命中标题权重高，命中摘要权重低。留空则不过滤。
# 覆盖四个板块的宽口径词，用于拓展视野而非贴合单一课题
keywords:
  # 可信人工智能
  - "trustworthy"
  - "fairness"
  - "fair "
  - "bias"
  - "privacy"
  - "interpretability"
  - "explainable"
  - "transparency"
  - "accountability"
  - "safety"
  - "alignment"
  - "robustness"
  - "adversarial"
  - "governance"
  - "ethics"
  # 人机交互
  - "human-AI"
  - "human computer interaction"
  - "HCI"
  - "user study"
  - "interaction"
  - "interface"
  - "usability"
  - "human-centered"
  - "collaboration"
  - "mixed-initiative"
  # 语言模型与智能体
  - "large language model"
  - "LLM"
  - "language model"
  - "foundation model"
  - "agent"
  - "GPT"
  - "transformer"
  - "prompt"
  - "reasoning"
  - "instruction"
  - "retrieval"
  # AI4S 应用与科学
  - "scientific"
  - "science"
  - "chemistry"
  - "physics"
  - "biology"
  - "drug discovery"
  - "materials"
  - "health"
  - "medical"
  - "climate"
  - "robotics"
  - "application"

# 每天最多推送/入库的篇数
max_papers_per_day: 10

